ults.innerHTML=found.length?found.map(g=>`<a href="#game=${encodeURIComponent(g.slug)}" onclick="results.style.display='none'">${esc(g.name)}<small>مشاهده صفحه کامل بازی</small></a>`).join(''):'<div style="padding:15px;color:#777">بازی پیدا نشد</div>';results.style.display='block'});document.addEventListener('click',e=>{if(!e.target.closest('.search'))results.style.display='none'});window.addEventListener('hashchange',()=>{route();window.scrollTo({top:0,behavior:'auto'})});route();</script></body></html>
